<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MedAnchor Study emblem">
  <title>MedAnchor Study emblem</title>
  <desc>Glowing cyan-teal medical caduceus: a loop above a wide roller crossbar, a staff wound by a tight double helix with no snake heads, and a compact anchor base with downward barbs and a central spike, on a dark teal ground.</desc>

  <defs>
    <!-- userSpaceOnUse: straight-edged shapes have degenerate bounding boxes and
         an objectBoundingBox gradient silently fails to paint on them. -->
    <linearGradient id="core" gradientUnits="userSpaceOnUse" x1="0" y1="60" x2="0" y2="450">
      <stop offset="0%"   stop-color="#BFF4FA"/>
      <stop offset="30%"  stop-color="#79E6F2"/>
      <stop offset="65%"  stop-color="#38C6DE"/>
      <stop offset="100%" stop-color="#27BCD4"/>
    </linearGradient>

    <linearGradient id="helix" gradientUnits="userSpaceOnUse" x1="0" y1="150" x2="0" y2="340">
      <stop offset="0%"   stop-color="#CFFBFF"/>
      <stop offset="55%"  stop-color="#63E2F2"/>
      <stop offset="100%" stop-color="#22B4D6"/>
    </linearGradient>

    <radialGradient id="bg" cx="50%" cy="48%" r="70%">
      <stop offset="0%"   stop-color="#0C3B42"/>
      <stop offset="55%"  stop-color="#06262C"/>
      <stop offset="100%" stop-color="#000507"/>
    </radialGradient>

    <radialGradient id="bloom" cx="50%" cy="52%" r="44%">
      <stop offset="0%"   stop-color="#4FE6F5" stop-opacity="0.26"/>
      <stop offset="48%"  stop-color="#1FB0D6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="11" result="wide"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="tight"/>
      <feMerge>
        <feMergeNode in="wide"/>
        <feMergeNode in="tight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#bloom)"/>

  <g filter="url(#neon)">
    <!-- ===================== TOP LOOP AND NECK ======================= -->
    <g fill="none" stroke="url(#core)" stroke-linecap="round">
      <circle cx="256" cy="88" r="23" stroke-width="9"/>
      <circle cx="256" cy="90" r="10.5" stroke-width="4.5" opacity="0.9"/>
      <path d="M256 111 L256 124" stroke-width="7"/>
    </g>

    <!-- ==================== WIDE ROLLER CROSSBAR ======================
         Wider relative to the symbol than before, matching the reference. -->
    <g>
      <rect x="158" y="118" width="196" height="25" rx="12.5" fill="url(#core)"/>
      <rect x="170" y="124" width="172" height="6.5" rx="3.25" fill="#EAFEFF" opacity="0.5"/>
      <rect x="174" y="118" width="9" height="25" rx="4.5" fill="#0A3238" opacity="0.5"/>
      <rect x="329" y="118" width="9" height="25" rx="4.5" fill="#0A3238" opacity="0.5"/>
    </g>

    <!-- ========================= CENTRAL STAFF ======================== -->
    <rect x="247" y="141" width="18" height="252" rx="9" fill="url(#core)"/>
    <rect x="252" y="149" width="5" height="238" rx="2.5" fill="#EAFEFF" opacity="0.4"/>

    <!-- ============== TIGHT DOUBLE HELIX, NO SNAKE HEADS =============
         Two full coils hugging the staff. Plain closed curves: no heads, no
         faces, no animal features. -->
    <g fill="none" stroke="url(#helix)" stroke-linecap="round">
      <path d="M232 160
               C232 190 280 190 280 220
               C280 250 232 250 232 280
               C232 306 266 312 272 330"
            stroke-width="12" opacity="0.97"/>
      <path d="M280 160
               C280 190 232 190 232 220
               C232 250 280 250 280 280
               C280 306 246 312 240 330"
            stroke-width="12" opacity="0.97"/>
      <g stroke="#BFF8FF" stroke-width="3.6" opacity="0.45">
        <path d="M242 182 L270 182"/>
        <path d="M242 250 L270 250"/>
      </g>
    </g>

    <!-- ================== COMPACT ANCHOR BASE ========================
         Steep, close arms with the tips facing straight down, as in the
         reference. Sweeping them wide and shallow made them read as horns. -->
    <g fill="none" stroke="url(#core)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M249 320
               C224 330 202 348 192 372
               C187 385 185 398 186 410
               C193 399 202 390 214 383
               C233 371 246 356 254 344"
            stroke-width="11"/>
      <path d="M263 320
               C288 330 310 348 320 372
               C325 385 327 398 326 410
               C319 399 310 390 298 383
               C279 371 266 356 258 344"
            stroke-width="11"/>
      <path d="M256 344 L256 412" stroke-width="12"/>
    </g>

    <!-- Sharp filled tips: a round line cap cannot make a point. -->
    <g fill="url(#core)">
      <path d="M186 424 L172 400 L200 404 Z"/>
      <path d="M326 424 L340 400 L312 404 Z"/>
      <path d="M256 432 L244 408 L268 408 Z"/>
    </g>
  </g>
</svg>