<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MedAnchor Study emblem">
  <title>MedAnchor Study emblem</title>
  <desc>Glowing cyan-teal medical caduceus: a loop and roller crossbar at the top, a staff wound by a double helix with no snake heads, and an anchor base with downward-pointing barbs and a central spike, on a dark teal-black ground.</desc>

  <defs>
    <!-- userSpaceOnUse throughout: the staff and crossbar are straight-edged
         shapes with degenerate bounding boxes in places, and an
         objectBoundingBox gradient silently fails to paint on those. -->
    <linearGradient id="core" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="512">
      <stop offset="0%"   stop-color="#EAFEFF"/>
      <stop offset="22%"  stop-color="#7FF0FA"/>
      <stop offset="55%"  stop-color="#33CFE6"/>
      <stop offset="85%"  stop-color="#1FB0D6"/>
      <stop offset="100%" stop-color="#2ACBD8"/>
    </linearGradient>

    <linearGradient id="helix" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="512">
      <stop offset="0%"   stop-color="#CFFBFF"/>
      <stop offset="50%"  stop-color="#6FE9F7"/>
      <stop offset="100%" stop-color="#25BEDC"/>
    </linearGradient>

    <!-- Dark teal ground, matching the reference rather than flat black. -->
    <radialGradient id="bg" cx="50%" cy="46%" r="72%">
      <stop offset="0%"   stop-color="#0E3F45"/>
      <stop offset="55%"  stop-color="#072A30"/>
      <stop offset="100%" stop-color="#000607"/>
    </radialGradient>

    <radialGradient id="bloom" cx="50%" cy="52%" r="46%">
      <stop offset="0%"   stop-color="#4FE6F5" stop-opacity="0.30"/>
      <stop offset="45%"  stop-color="#1FB0D6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12" result="wide"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="tight"/>
      <feMerge>
        <feMergeNode in="wide"/>
        <feMergeNode in="tight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ground -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#bloom)"/>

  <g filter="url(#neon)">
    <!-- ======================= TOP LOOP AND NECK ===================== -->
    <g fill="none" stroke="url(#core)" stroke-linecap="round">
      <!-- Main loop at the top -->
      <circle cx="256" cy="72" r="26" stroke-width="9"/>
      <!-- Inner ring, as in the reference -->
      <circle cx="256" cy="74" r="12" stroke-width="5" opacity="0.9"/>
      <!-- Neck joining the loop to the crossbar -->
      <path d="M256 98 L256 116" stroke-width="8"/>
    </g>

    <!-- ==================== ROLLER CROSSBAR ========================== -->
    <!-- A thick horizontal cylinder with rounded caps, not a thin bar. -->
    <g>
      <rect x="172" y="112" width="168" height="26" rx="13" fill="url(#core)"/>
      <!-- Highlight along the top of the cylinder -->
      <rect x="184" y="118" width="144" height="7" rx="3.5" fill="#EAFEFF" opacity="0.55"/>
      <!-- Darker seam at each end, reading as a roller mount -->
      <rect x="186" y="112" width="9" height="26" rx="4.5" fill="#0A3238" opacity="0.55"/>
      <rect x="317" y="112" width="9" height="26" rx="4.5" fill="#0A3238" opacity="0.55"/>
    </g>

    <!-- ======================== CENTRAL STAFF ========================= -->
    <rect x="246" y="138" width="20" height="312" rx="10" fill="url(#core)"/>
    <rect x="251" y="146" width="6" height="296" rx="3" fill="#EAFEFF" opacity="0.45"/>

    <!-- ================ DOUBLE HELIX, NO SNAKE HEADS ==================
         Two interleaved coils wound around the staff, closed off at both ends.
         Deliberately no heads, faces or animal features: this is the medical
         caduceus, not the Greek one. -->
    <g fill="none" stroke="url(#helix)" stroke-linecap="round">
      <path d="M229 160
               C229 192 283 192 283 224
               C283 256 229 256 229 288
               C229 316 270 320 274 340"
            stroke-width="12" opacity="0.97"/>
      <path d="M283 160
               C283 192 229 192 229 224
               C229 256 283 256 283 288
               C283 316 242 320 238 340"
            stroke-width="12" opacity="0.97"/>
      <!-- Rungs between the strands -->
      <g stroke="#BFF8FF" stroke-width="4" opacity="0.5">
        <path d="M239 180 L273 180"/>
        <path d="M239 256 L273 256"/>
      </g>
    </g>

    <!-- ===================== ANCHOR BASE ============================== -->
    <!-- Arms sweep outward and DOWN to sharp points, with a central spike
         below them, as in the reference artwork. -->
    <g fill="none" stroke="url(#core)" stroke-linecap="round" stroke-linejoin="round">
      <!-- Left arm -->
      <path d="M246 344
               C214 356 176 384 158 424
               C150 444 146 460 150 474
               C156 460 168 446 186 434
               C212 416 236 392 250 372"
            stroke-width="11"/>
      <!-- Right arm, mirrored -->
      <path d="M266 344
               C298 356 336 384 354 424
               C362 444 366 460 362 474
               C356 460 344 446 326 434
               C300 416 276 392 262 372"
            stroke-width="11"/>
      <!-- Central downward spike -->
      <path d="M256 392 L256 470" stroke-width="12"/>
    </g>

    <!-- Sharp tips, filled so they read as points rather than rounded caps -->
    <g fill="url(#core)">
      <path d="M150 480 L138 452 L162 458 Z"/>
      <path d="M362 480 L374 452 L350 458 Z"/>
      <path d="M256 486 L244 462 L268 462 Z"/>
    </g>
  </g>
</svg>