<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MedAnchor Study emblem">
  <title>MedAnchor Study emblem</title>
  <desc>Glossy cyan medical caduceus: a shining loop above a roller crossbar, a chrome staff wound by two thick headless coils, and an anchor base with barbed flukes, on dark teal.</desc>

  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%"   stop-color="#0F4149"/>
      <stop offset="55%"  stop-color="#07272D"/>
      <stop offset="100%" stop-color="#000506"/>
    </radialGradient>

    <radialGradient id="bloom" cx="50%" cy="50%" r="46%">
      <stop offset="0%"   stop-color="#5FF0FA" stop-opacity="0.22"/>
      <stop offset="50%"  stop-color="#1FB0D6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Cylinder shading: bright near the light, deep teal in shadow. -->
    <linearGradient id="metal" gradientUnits="userSpaceOnUse" x1="190" y1="0" x2="330" y2="0">
      <stop offset="0%"   stop-color="#0F7C9C"/>
      <stop offset="28%"  stop-color="#5CE4F2"/>
      <stop offset="50%"  stop-color="#EFFEFF"/>
      <stop offset="74%"  stop-color="#3CC4DC"/>
      <stop offset="100%" stop-color="#0C6B88"/>
    </linearGradient>

    <linearGradient id="metalStaff" gradientUnits="userSpaceOnUse" x1="238" y1="0" x2="274" y2="0">
      <stop offset="0%"   stop-color="#0F7C9C"/>
      <stop offset="30%"  stop-color="#69E7F4"/>
      <stop offset="52%"  stop-color="#F2FEFF"/>
      <stop offset="76%"  stop-color="#39C2DA"/>
      <stop offset="100%" stop-color="#0C6B88"/>
    </linearGradient>

    <linearGradient id="coil" gradientUnits="userSpaceOnUse" x1="200" y1="0" x2="312" y2="0">
      <stop offset="0%"   stop-color="#14A3C2"/>
      <stop offset="30%"  stop-color="#74E9F6"/>
      <stop offset="55%"  stop-color="#FFFFFF"/>
      <stop offset="80%"  stop-color="#45C6DE"/>
      <stop offset="100%" stop-color="#0E7A9B"/>
    </linearGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="9" result="glow"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="edge"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="edge"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#bloom)"/>

  <g filter="url(#soft)">
    <!-- ========================== TOP LOOP ============================ -->
    <!-- Thick torus, lit from upper left, with a specular arc. -->
    <g fill="none" stroke-linecap="round">
      <circle cx="256" cy="112" r="49" stroke="#14789A" stroke-width="34"/>
      <circle cx="256" cy="112" r="49" stroke="url(#metal)" stroke-width="30"/>
      <path d="M218 98 A46 46 0 0 1 250 69" stroke="#FFFFFF" stroke-width="10" opacity="0.9"/>
    </g>

    <!-- ======================= CENTRAL SHAFT ===========================
         Runs from inside the loop all the way into the anchor crown. -->
    <rect x="240" y="96" width="32" height="300" rx="15" fill="#0E7899"/>
    <rect x="240" y="96" width="32" height="300" rx="15" fill="url(#metalStaff)"/>
    <!-- Highlight runs above and below the coils only. A continuous white
         stripe straight through them merges everything into one bright mass. -->
    <rect x="247" y="104" width="7" height="140" rx="3.5" fill="#FFFFFF" opacity="0.65"/>
    <rect x="247" y="404" width="7" height="16" rx="3.5" fill="#FFFFFF" opacity="0.4"/>

    <!-- ===================== ROLLER CROSSBAR ============================
         Horizontal cylinder with domed end caps and mounting collars where it
         meets the shaft. -->
    <g>
      <rect x="130" y="198" width="252" height="44" rx="22" fill="#0E7899"/>
      <rect x="130" y="198" width="252" height="44" rx="22" fill="url(#metal)"/>
      <rect x="146" y="205" width="220" height="11" rx="5.5" fill="#FFFFFF" opacity="0.6"/>
      <!-- End caps -->
      <circle cx="130" cy="220" r="22" fill="#0E7899"/>
      <circle cx="130" cy="220" r="22" fill="url(#metal)"/>
      <circle cx="382" cy="220" r="22" fill="#0E7899"/>
      <circle cx="382" cy="220" r="22" fill="url(#metal)"/>
      <ellipse cx="122" cy="212" rx="7" ry="10" fill="#FFFFFF" opacity="0.75"/>
      <ellipse cx="390" cy="212" rx="7" ry="10" fill="#FFFFFF" opacity="0.75"/>
      <!-- Collars gripping the shaft -->
      <rect x="228" y="192" width="15" height="56" rx="7.5" fill="#0B627F"/>
      <rect x="228" y="192" width="15" height="56" rx="7.5" fill="url(#metal)"/>
      <rect x="269" y="192" width="15" height="56" rx="7.5" fill="#0B627F"/>
      <rect x="269" y="192" width="15" height="56" rx="7.5" fill="url(#metal)"/>
    </g>

    <!-- ============ CADUCEUS COILS, DELIBERATELY HEADLESS =============
         Two thick serpentine strands with visible dark gaps between coil and
         staff at every crossing, mirroring the reference where the shaft
         shows through. Reference shows snake heads here; the brief says NO
         snake heads, so each strand rounds off plainly at top and bottom. -->
    <g fill="none" stroke="url(#coil)" stroke-linecap="round">
      <path d="M252 252
               C236 276 288 284 286 308
               C284 332 244 334 248 362
               C252 384 288 386 286 408"
            stroke-width="21"/>
      <path d="M268 252
               C280 272 232 282 234 304
               C236 326 276 332 272 356
               C268 380 234 382 232 404"
            stroke-width="21"/>
    </g>
    <!-- Specular runs along the upper edge of each coil -->
    <g fill="none" stroke="#EAFEFF" stroke-linecap="round" opacity="0.65">
      <path d="M248 256 C236 278 282 286 280 306" stroke-width="5"/>
      <path d="M268 256 C278 274 236 284 238 302" stroke-width="5"/>
    </g>

    <!-- ====================== ANCHOR BASE ==============================
         Crown first, then ONE smooth arm per side curving down and out to an
         upward barb. A second parallel highlight line is what made the
         previous attempt read as trousers, so there is none: the arms get a
         single short edge-light on their inner curve instead. -->
    <g fill="#0E7899" stroke="url(#metal)" stroke-linejoin="round">
      <!-- Crown: the collar the arms leave from and the spike hangs from -->
      <rect x="238" y="392" width="36" height="30" rx="8"/>
      <!-- Left arm -->
      <path d="M252 404
               C214 410 178 432 158 464
               C150 477 146 490 146 502
               L130 478
               C140 468 154 458 170 450
               C146 442 124 424 112 400
               C104 384 102 366 106 350
               C110 376 124 402 150 420
               C184 406 222 398 252 398 Z"/>
      <!-- Right arm, mirrored -->
      <path d="M260 404
               C298 410 334 432 354 464
               C362 477 366 490 366 502
               L382 478
               C372 468 358 458 342 450
               C366 442 388 424 400 400
               C408 384 410 366 406 350
               C402 376 388 402 362 420
               C328 406 290 398 260 398 Z"/>
      <!-- Downward spike -->
      <path d="M256 408 L241 408 L241 464 L256 488 L271 464 L271 408 Z"/>
    </g>
    <g fill="none" stroke="#EAFEFF" stroke-linecap="round" opacity="0.5">
      <path d="M150 420 C180 400 216 392 248 391" stroke-width="5"/>
      <path d="M362 420 C332 400 296 392 264 391" stroke-width="5"/>
      <path d="M256 414 L256 462" stroke-width="4"/>
    </g>
  </g>
</svg>