<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#073b3a" />
		<meta name="description" content="A focused study workspace for healthcare learners." />
		<title>Dashboard | MedAnchor Study</title>
		<link rel="stylesheet" href="css/style.css" />
		<script defer src="js/data.js"></script>
		<script defer src="js/app.js"></script>
	</head>
	<body>
		<div class="app">
			<aside class="sidebar" id="sidebar" aria-label="Main navigation">
				<a class="brand" href="#/dashboard" aria-label="MedAnchor Study dashboard">
					<span class="brand-mark" aria-hidden="true">M</span>
					<span class="brand-text">
						<span class="brand-name">MedAnchor</span>
						<span class="brand-sub">STUDY WORKSPACE</span>
					</span>
				</a>
				<nav class="nav" id="nav" aria-label="Study workspace"></nav>
				<div class="sidebar-foot">
					<div class="focus-card">
						<div class="focus-label">Today's anchor</div>
						<div class="focus-text" id="sideFocus">Loading your plan...</div>
					</div>
					<button class="side-reset" type="button" data-reset-demo>Reset demo data</button>
				</div>
			</aside>

			<div class="main">
				<header class="topbar">
					<button class="menu-btn" id="menuBtn" type="button" aria-label="Open navigation" aria-controls="sidebar">☰</button>
					<div class="topbar-title" id="topbarTitle">Dashboard</div>
					<div class="topbar-right">
						<div class="streak"><span aria-hidden="true">✦</span><span id="streakNum">0</span><span>day streak</span></div>
						<div class="avatar" id="avatar" aria-label="Student profile">S</div>
					</div>
				</header>

				<main class="content" id="view" tabindex="-1" aria-live="polite"></main>
			</div>
		</div>

		<div class="toast-wrap" id="toasts" aria-live="polite" aria-atomic="true"></div>
		<div class="modal-backdrop hidden" id="modalBackdrop"></div>
		<section class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
			<header class="modal-head">
				<h3 id="modalTitle"></h3>
				<button class="modal-close" type="button" data-action="close-modal" aria-label="Close dialog">&times;</button>
			</header>
			<div class="modal-body" id="modalBody"></div>
		</section>
	</body>
</html>
