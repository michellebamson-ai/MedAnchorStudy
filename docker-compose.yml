services:
  db:
    image: postgres:16-alpine
    container_name: medanchor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: medanchor
      POSTGRES_PASSWORD: medanchor_dev
      POSTGRES_DB: medanchor
    ports:
      - "5432:5432"
    volumes:
      - medanchor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medanchor -d medanchor"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  medanchor_pgdata:
