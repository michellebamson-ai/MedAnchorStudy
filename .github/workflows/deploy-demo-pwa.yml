name: Deploy demo PWA

on:
  push:
    branches: [main]
    paths:
      - "demo-pwa/**"
      - ".github/workflows/deploy-demo-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # GitHub Pages would otherwise run every .nojekyll-looking file through
      # Jekyll, which strips files starting with an underscore.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-pwa

      - id: deployment
        uses: actions/deploy-pages@v4
